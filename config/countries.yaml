# Controlled ISO-3 country mapping for the G20 sovereign panel (Phase 1 scope).
# The European Union is a G20 member but is an aggregate region, not a sovereign
# country, and is deliberately excluded from this mapping per 00_overview.md /
# 06_data_sources_and_licensing.md ("aggregates must never leak into the
# sovereign-country ranking"). Names are controlled here rather than
# fuzzy-matched at runtime; source_name_aliases lists every spelling seen in
# OWID CO2 and World Bank WDI so ingestion can resolve to country_iso3 deterministically.
countries:
  - country_iso3: ARG
    country_name: Argentina
    g20_flag: true
    region: Latin America and Caribbean
    income_group: Upper middle income
    source_name_aliases: ["Argentina"]
  - country_iso3: AUS
    country_name: Australia
    g20_flag: true
    region: East Asia and Pacific
    income_group: High income
    source_name_aliases: ["Australia"]
