[project]
name = "climate-risk"
version = "1.0.0"
description = "Climate Transition Risk Intelligence Platform"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
  "pandas>=2.2",
  "numpy>=1.26",
  "scipy>=1.13",
  "statsmodels>=0.14",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "pyarrow>=16.0",
  "httpx>=0.27",
  "typer>=0.12",
  "structlog>=24.1",
  "pyyaml>=6.0",
  "fsspec>=2024.6",
  "adlfs>=2024.7",
  "azure-identity>=1.17",
]

[project.optional-dependencies]
api = ["fastapi>=0.111", "uvicorn>=0.30"]
dev = [
  "pytest>=8.2",
  "pytest-cov>=5.0",
  "hypothesis>=6.100",
  "ruff>=0.5",
  "mypy>=1.10",
  "pandas-stubs>=2.2",
  "types-PyYAML>=6.0",
  "pre-commit>=3.7",
  "respx>=0.21",
]

[project.scripts]
climate-risk = "climate_risk.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/climate_risk"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# FastAPI's dependency-injection convention is `param: T = Depends(...)` --
# a function call in an argument default, which B008 exists to catch as a
# general Python footgun (shared mutable default) but is the documented,
# correct pattern here: FastAPI re-resolves Depends() per request.
"src/climate_risk/api/routes/*.py" = ["B008"]

[tool.mypy]
python_version = "3.12"
packages = ["climate_risk"]
mypy_path = "src"
strict = true
disallow_untyped_defs = true
ignore_missing_imports = false

[[tool.mypy.overrides]]
module = ["scipy.*", "statsmodels.*", "adlfs.*", "fsspec.*", "azure.identity.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --cov=climate_risk --cov-report=term-missing"

[tool.coverage.run]
source = ["src/climate_risk"]
