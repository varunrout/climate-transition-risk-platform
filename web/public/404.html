<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Climate Transition Risk Intelligence</title>
    <!--
      GitHub Pages serves this file for any unknown path (e.g. a direct
      load of /country/GBR, or a refresh on that route), since it is a
      static host with no server-side rewrite rules. This is the standard
      "spa-github-pages" redirect trick (rafgraph/spa-github-pages): encode
      the real path into a query string, redirect to index.html, and a
      matching decode script there (see index.html) restores the real URL
      via history.replaceState before React Router ever sees it -- so
      clean URLs work on direct load/refresh without falling back to hash
      routing.
    -->
    <script>
      var segmentCount = 1 // number of path segments to treat as the base (repo name for a GH Pages project site)
      var l = window.location
      l.replace(
        l.protocol +
          '//' +
          l.hostname +
          (l.port ? ':' + l.port : '') +
          l.pathname
            .split('/')
            .slice(0, 1 + segmentCount)
            .join('/') +
          '/?/' +
          l.pathname.slice(1).split('/').slice(segmentCount).join('/').replace(/&/g, '~and~') +
          (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
          l.hash,
      )
    </script>
  </head>
  <body></body>
</html>
